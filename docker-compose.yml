services:
  hysteria:
    image: tobyxdd/hysteria:v2
    container_name: hy2
    restart: always
    network_mode: host
    volumes:
      - ./hysteria2/config.yaml:/etc/hysteria/config.yaml:ro
      - ${CERT_PATH}:/etc/letsencrypt:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-fake:
    image: nginx:alpine
    container_name: nginx-fake
    restart: always
    ports:
      - "${MASQUERADE_PORT}:${NGINX_LISTEN_PORT}"
      - "${LOCALHOST}:${XRAY_UNAUTH_PORT}:${XRAY_UNAUTH_PORT}"
    environment:
      - NGINX_LISTEN_PORT=${NGINX_LISTEN_PORT}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ${CERT_PATH}:/etc/letsencrypt:ro
    logging: *default-logging

  xray:
    image: ghcr.io/xtls/xray-core:26.10.29
    container_name: xray
    restart: always
    network_mode: host
    depends_on:
      - nginx-fake
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    command: ["run", "-config", "/etc/xray/config.json"]
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "${UPTIME_KUMA_PORT}:3001"
    volumes:
      - ./uptime-kuma:/app/data
    logging: *default-logging