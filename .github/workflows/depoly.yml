name: Deploy Infra

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [redeploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
          REALITY_PRIVATE_KEY: ${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VLESS_UUID,REALITY_PRIVATE_KEY,REALITY_SHORT_ID
          script: |
            set -e
            umask 077
            PROJECT_DIR="/root/sw_proxy_infra"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }} $PROJECT_DIR
            fi
            cd $PROJECT_DIR
            git pull origin main

            echo "--- Generating .env configuration ---"
            cat <<EOF > .env
            HY2_PASSWORD=${{ secrets.HY2_PASSWORD }}
            DOMAIN=${{ secrets.DOMAIN }}
            CERT_PATH=${{ secrets.CERT_PATH }}
            HY2_PORT=${{ secrets.HY2_PORT }}
            MASQUERADE_PORT=${{ secrets.MASQUERADE_PORT }}
            NGINX_LISTEN_PORT=${{ secrets.NGINX_LISTEN_PORT }}
            UPTIME_KUMA_PORT=${{ secrets.UPTIME_KUMA_PORT }}
            XRAY_PORT=${{ secrets.XRAY_PORT }}
            XRAY_UNAUTH_PORT=${{ secrets.XRAY_UNAUTH_PORT }}
            VLESS_UUID=${{ secrets.VLESS_UUID }}
            REALITY_PRIVATE_KEY=${{ secrets.REALITY_PRIVATE_KEY }}
            REALITY_SHORT_ID=${{ secrets.REALITY_SHORT_ID }}
            EOF

            if [ -z "$VLESS_UUID" ] || [ -z "$REALITY_PRIVATE_KEY" ] || [ -z "$REALITY_SHORT_ID" ]; then
                echo "VLESS_UUID, REALITY_PRIVATE_KEY, and REALITY_SHORT_ID secrets must be configured."
                exit 1
            fi

            if ! command -v envsubst &> /dev/null; then
                echo "Installing envsubst..."
                apt-get update && apt-get install -y gettext-base
            fi

            echo "Generating Hysteria2 config from template..."
            export $(cat .env | xargs)
            envsubst < $PROJECT_DIR/hysteria2/config.yaml.template > $PROJECT_DIR/hysteria2/config.yaml
            XRAY_CONFIG="$PROJECT_DIR/xray/config.json"
            if [ -d "$XRAY_CONFIG" ]; then
              echo "Removing empty directory left by an earlier Xray bind mount."
              rmdir "$XRAY_CONFIG" || {
                echo "Xray config path is a non-empty directory; refusing to remove it."
                exit 1
              }
            fi
            envsubst < "$PROJECT_DIR/xray/config.json.template" > "$XRAY_CONFIG.tmp"
            mv "$XRAY_CONFIG.tmp" "$XRAY_CONFIG"
            chmod 644 "$XRAY_CONFIG"

            echo "Checking Nginx configuration template..."
            if ! docker run --rm --env-file .env \
              -v $PROJECT_DIR/nginx/templates:/etc/nginx/templates:ro \
              -v $CERT_PATH:/etc/letsencrypt:ro \
              nginx:alpine \
              sh -c "envsubst '\$NGINX_LISTEN_PORT \$XRAY_UNAUTH_PORT \$DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -t" > /tmp/nginx_check 2>&1; then
              echo "Nginx config is invalid! Deployment aborted."
              cat /tmp/nginx_check
              exit 1
            fi

            echo "Checking Xray configuration..."
            if [ ! -s "$PROJECT_DIR/xray/config.json" ]; then
              echo "Generated Xray config is missing or empty."
              exit 1
            fi
            docker run --rm \
              -v "$PROJECT_DIR/xray/config.json:/etc/xray/config.json:ro" \
              ghcr.io/xtls/xray-core:latest \
              run -test -config /etc/xray/config.json

            docker compose --env-file .env config -q
            echo "Deployment starting..."
            docker compose up -d --remove-orphans
            docker restart hy2 nginx-fake xray

            echo "--- Deployment Status ---"
            sleep 5
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "--- Health Check ---"
            if [ "$(docker inspect -f '{{.State.Running}}' hy2)" == "true" ]; then
              echo "Hysteria2 is running."
            else
              echo "Hysteria2 failed to start."
              docker logs hy2 --tail 20
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' xray)" == "true" ]; then
              echo "Xray is running."
            else
              echo "Xray failed to start."
              docker logs xray --tail 20
              exit 1
            fi

      - name: Discord Notification
        uses: rjstone/discord-webhook-notify@v1
        if: always()
        with:
          severity: ${{ job.status == 'success' && 'info' || 'error' }}
          details: |
            **Deploy Status**: ${{ job.status }}
            **Node**: `${{ secrets.DOMAIN }}:${{ secrets.HY2_PORT }}`
            **Monitor**: `http://${{ secrets.REMOTE_IP }}:${{ secrets.UPTIME_KUMA_PORT }}`
            Triggered by: ${{ github.event_name }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}